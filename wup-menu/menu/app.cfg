# The Homebrew Menu: an app like the others (libwup, LVGL), kept in the menu's flash slot, started by the kernel
name = Homebrew Menu
author = wup-homebrew
version = 2.0.1
description = Apps, Wi-Fi, file sharing and the Netloader
lvgl = yes
net = yes                # (lwIP's threads: sockets and HTTPS for the App Store and Software Update; FTP,
                         #  Developer Mode and the Netloader on its callback API, under its core lock)
https = yes
system = yes
deps = jsmn
include = ../common
sources = main.c ui.c config.c sys.c apps.c sound.c clock.c wuplink.c dbgsrv.c ftpd.c netshare.c wifi/wifi_hw.c wifi/pbkdf2.c ../common/catalog.c ../common/release.c
thumb_sources = main.c ui.c config.c sys.c apps.c sound.c clock.c wuplink.c dbgsrv.c ftpd.c netshare.c wifi/wifi_hw.c
defines = MENU_VERSION="2.0.1"

# The Homebrew Menu: an app like the others (libwup, LVGL), kept in the menu slot of the flash, started by the loader
name = Homebrew Menu
author = wup-homebrew
version = 1.0.4
description = Apps, Wi-Fi, file sharing and the Netloader
lvgl = yes
net = raw
large = yes
system = yes
text_in_big = lvgl    # the menu is no .wup: big.c loads this from the menu's own flash slot (WUPB blob after the image)
sources = main.c ui.c config.c sys.c apps.c sound.c clock.c wuplink.c dbgsrv.c ftpd.c netshare.c wifi/wifi_hw.c wifi/pbkdf2.c bundle.c
thumb_sources = main.c ui.c config.c sys.c apps.c sound.c clock.c wuplink.c dbgsrv.c ftpd.c wifi/wifi_hw.c bundle.c
defines = WUP_NETIF_RING=32768 WUP_NET_PBUF_POOL=24 WUP_NET_MEM_SIZE=32768 MENU_VERSION="1.0.4" BUNDLE_OFF=0x2c9000

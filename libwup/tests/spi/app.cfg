# tests/spi: how fast the pad's flash can be read. The kernel reads it at 8 MHz (kernel/src/spi.c); this reads the same
# 64 KB with each clock divider, with the plain read (0x03) and the fast read (0x0B, a dummy byte), and compares every
# byte with the kernel's own read. Reads only. The table goes to the screen and to /spitest.txt.
